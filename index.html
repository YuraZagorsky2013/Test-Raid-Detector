<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="icon" type="image/png" href="20260430180728.png">
    <title>Raid Detector</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div id="toast"></div>

<div class="app">

    <!-- HEADER -->
    <header class="header glass">
        <div class="profile" onclick="openSettings()">
            <img
    src="20260513221929.png"
    class="avatar"
    id="avatar"
    alt="Avatar"
>

            <div>
                <div class="name" id="name"></div>
                <div class="desc">Натисни щоб редагувати</div>
            </div>
        </div>

        <button class="reset-btn" onclick="resetProfile()">
            🗑 Скинути профіль
        </button>
    </header>

    <!-- MAIN -->
    <main>

<div class="search-box">
    <input
    type="text"
    placeholder="Пошук..."
    oninput="searchContent(this.value)"
>
</div>
        <!-- HOME -->
        <section class="page active" id="home">

         

    <div class="card glow center">
        
     <img src="20260430180728.png" class="logo" alt="logo">

                <h2>Raid Detector</h2>

                <h5>Тут ви зможете бачити новини про атаки каналів, зможете знайти конкретну подію або рейдера, дізнатись, як безпечно вести канал і радитись з нашим SafetyGuide</h5>

    </div>
                

           
<h2>Канали</h2>
<div class="grid" id="channelsList"></div>

        </section>

        <!-- NEWS -->
        <section class="page" id="news">

            <h2>Новини</h2>

            <div id="newsList"></div>

            <div class="card news-editor" id="newsEditor">

                <input
                    type="text"
                    id="newsInput"
                    placeholder="Додати новину..."
                >

                <button onclick="addNews()">➕</button>

            </div>

        </section>

        <!-- ANALYTICS -->
        <section class="page" id="archive">

            <h2>Аналітика</h2>

            <div class="card">
                <canvas id="chart"></canvas>
            </div>
            <h2>Архів Рейдерів</h2>
            <div id="raidersList"></div>
        </section>

        <!-- GUIDE -->
        <section class="page" id="guide">

            <h2>Safety Guide</h2>

            <div id="chatMessages"></div>

            <div class="chat">

                <input
                   type="text"
                   id="chatInput"
                   placeholder="Запитай в SafetyGuide"
>

                <button onclick="sendMessage()">➤</button>


            </div>


<div class="quick-buttons">

<button onclick="quickAsk('Що таке рейд?')">
Що таке рейд?
</button>

<button onclick="quickAsk('Як захистити канал?')">
Захист каналу
</button>

<button onclick="quickAsk('alex')">
Перевірити nick
</button>

</div>

        </section>

    </main>

    <!-- NAV -->
    <nav class="nav glass">
        <button class="active" onclick="openPage('home', this)">
            🏠
        </button>

        <button onclick="openPage('news', this)">
            📰
        </button>

        <button onclick="openPage('archive', this)">
            📊
        </button>

        <button onclick="openPage('guide', this)">
            💬
        </button>

    </nav>

</div>

<!-- SETTINGS -->
<div class="modal" id="settings">

    <div class="modal-content">

        <h3>Налаштування</h3>
        <input
            type="file"
            id="newAvatar"
            accept="image/*"
        >

        <input
            type="text"
            id="newName"
            placeholder="Нік"
        >

        <input
            type="text"
            id="newPhone"
            placeholder="Телефон"
        >

<div class="theme-switch">
    <span>темна тема</span>

<label class="switch">

        <input

            type="checkbox"

            id="themeToggle"
        >

      <span class="slider"></span>
</label>
</div>

        <button onclick="saveProfile()">
            Зберегти
        </button>

    </div>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
